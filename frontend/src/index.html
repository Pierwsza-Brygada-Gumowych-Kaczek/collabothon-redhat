<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DuckBank · Business</title>
  <base href="/">
  <script>
    // Apply the saved / system theme before Angular starts, to avoid a white flash.
    (function () {
      var t = null;
      try { t = localStorage.getItem('duckbank-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <app-root></app-root>
</body>
</html>
