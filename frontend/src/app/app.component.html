<main>
  <h1>OpenShift AI Chat</h1>

  <section class="messages">
    @for (m of messages(); track $index) {
      <div class="msg" [class.user]="m.role === 'user'">{{ m.content }}</div>
    }
    @if (loading()) {
      <div class="msg">…</div>
    }
    @if (error()) {
      <div class="error">{{ error() }}</div>
    }
  </section>

  <form (ngSubmit)="send()">
    <input name="input" [(ngModel)]="input" placeholder="Napisz wiadomość…" autocomplete="off" />
    <button type="submit" [disabled]="loading()">Wyślij</button>
  </form>
</main>
