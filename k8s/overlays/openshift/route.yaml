apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: frontend
  annotations:
    # AI answers can take longer than the router's 30 s default; nginx allows 120 s.
    haproxy.router.openshift.io/timeout: 120s
spec:
  to:
    kind: Service
    name: frontend
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
