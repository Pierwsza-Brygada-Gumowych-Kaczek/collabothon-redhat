apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - route.yaml

patches:
  # The Route terminates TLS, so the session cookie can be HTTPS-only.
  - target:
      kind: ConfigMap
      name: backend-config
    patch: |-
      - op: replace
        path: /data/COOKIE_SECURE
        value: "true"
