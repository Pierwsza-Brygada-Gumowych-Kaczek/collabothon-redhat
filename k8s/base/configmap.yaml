apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  LOG_LEVEL: "INFO"
  # Wewnątrzklastrowy adres InferenceService z OpenShift AI (KServe, vLLM) — zmień na swój:
  OPENSHIFT_AI_URL: "http://granite-predictor.my-ai-project.svc.cluster.local:8080/v1"
  OPENSHIFT_AI_MODEL: "granite"
  OPENSHIFT_AI_VERIFY_SSL: "true"
  CORS_ORIGINS: '["*"]'
