# Non-secret backend settings (same keys as backend/.env.example). Secrets: secret.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  LOG_LEVEL: "INFO"
  # Frontend and API share one address (nginx proxies /api), so no CORS origins are needed.
  CORS_ORIGINS: '[]'
  # In-cluster address of the model the organisers provisioned in namespace "my-first-model".
  # Replace <model> with its InferenceService name (oc get inferenceservice -n my-first-model, or
  # Console: Networking > Services in project my-first-model — the "<name>-predictor" service).
  OPENSHIFT_AI_URL: "http://<model>-predictor.my-first-model.svc.cluster.local:8080/v1"
  OPENSHIFT_AI_MODEL: "granite"
  OPENSHIFT_AI_VERIFY_SSL: "true"
  OPENSHIFT_AI_TIMEOUT: "90"
  OPENSHIFT_AI_JSON_MODE: "true"
  AGENTS_DEMO_FALLBACK: "true"
  DB_CONNECT_RETRIES: "60"
  DB_CONNECT_RETRY_SECONDS: "2"
  SESSION_DAYS: "7"
  # Plain-HTTP clusters (Docker Desktop, Ingress without TLS) need false; the OpenShift overlay sets true.
  COOKIE_SECURE: "false"
  DEMO_USERNAME: "demo"
