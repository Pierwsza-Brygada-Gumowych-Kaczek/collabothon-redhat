# EXAMPLE values — change the passwords before a real deployment and do not commit real secrets.
# In production use Sealed Secrets / External Secrets, or create them by hand, e.g.:
#   kubectl create secret generic postgres-credentials \
#     --from-literal=database-user=duckbank --from-literal=database-password='<strong>' \
#     --from-literal=database-name=duckbank
#   kubectl create secret generic backend-secret \
#     --from-literal=DATABASE_URL='postgresql+psycopg://duckbank:<strong>@postgres:5432/duckbank' \
#     --from-literal=OPENSHIFT_AI_TOKEN="$(oc whoami -t)" --from-literal=DEMO_PASSWORD=demo
# (then remove secret.yaml from kustomization.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
type: Opaque
stringData:
  database-user: duckbank
  database-password: duckbank-change-me
  database-name: duckbank
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
type: Opaque
stringData:
  # Must match postgres-credentials above (host = the "postgres" Service).
  DATABASE_URL: postgresql+psycopg://duckbank:duckbank-change-me@postgres:5432/duckbank
  OPENSHIFT_AI_TOKEN: ""
  DEMO_PASSWORD: demo
