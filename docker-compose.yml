# Local stack for Docker Desktop:  docker compose up --build   ->  http://localhost:8080  (login: demo / demo)
#
#   postgres  - PostgreSQL 16 (Red Hat sclorg image, same as on Kubernetes/OpenShift), data in the
#               "pgdata" volume, so users, goals and transactions survive restarts.
#   backend   - FastAPI; settings from backend/.env, DATABASE_URL points at the postgres service.
#   frontend  - Angular build served by nginx, proxies /api to the backend.
#
# Database credentials come from the root .env (copy .env.example), defaults: duckbank/duckbank.
# Start from scratch (delete all data):  docker compose down -v

services:
  postgres:
    image: quay.io/sclorg/postgresql-16-c9s:latest
    environment:
      POSTGRESQL_USER: ${POSTGRES_USER:-duckbank}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:-duckbank}
      POSTGRESQL_DATABASE: ${POSTGRES_DB:-duckbank}
    volumes:
      - pgdata:/var/lib/pgsql/data
    ports:
      # Exposed so a backend running outside Docker (uvicorn) can use it too.
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $${POSTGRESQL_USER} -d $${POSTGRESQL_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-duckbank}:${POSTGRES_PASSWORD:-duckbank}@postgres:5432/${POSTGRES_DB:-duckbank}
      COOKIE_SECURE: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
